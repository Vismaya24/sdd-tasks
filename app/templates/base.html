<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nutrition Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/site.css') }}" rel="stylesheet">
</head>
<body>
  <nav class="navbar app-navbar mb-4">
    <div class="container">
      <a class="navbar-brand app-brand" href="{{ url_for('dashboard') }}">
        <span aria-hidden="true">🌿</span> Nutrition Tracker
      </a>
      <a class="btn btn-outline-light app-nav-button btn-sm" href="{{ url_for('targets') }}">Daily targets</a>
    </div>
  </nav>
  <main class="container app-main">
    {% for message in get_flashed_messages() %}
      <div class="alert app-flash alert-success" role="status">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
